[package]
name = "redoubt"
version = "0.1.0"
edition = "2021"
description = "РЕДУТ/1 — a fail-closed control channel for Modbus-era PLCs: Noise KK handshake, AEAD frames, replay windows that survive reboots, deny-overrides policy, dual control, reversible writes and a hash-chained audit log"
license = "MIT"
repository = "https://github.com/kostyk348/redoubt"
rust-version = "1.80"

[lib]
name = "redoubt"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
getrandom = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
panic = "abort"

[dev-dependencies]
snow = "0.9.6"
