name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: formatting
        run: cargo fmt --all -- --check
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --all-targets

  kani:
    name: kani (proofs over the compiled code)
    runs-on: ubuntu-latest
    # CBMC on this crate once ran 5h31m and was killed by the 6h job limit, so the
    # job gets its own wall: a hang now fails in minutes with a log, not overnight.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # policy_evaluation_is_total is excluded on purpose: CBMC never finishes
      # unwinding std's byte search over the parsed policy string (~4500 unwind
      # steps of core::slice::memchr before the runner was shut down). Re-enable
      # it once the harness carries a bound — see issue #1.
      - uses: model-checking/kani-github-action@v1
        with:
          args: --harness header_decoding_is_total_and_bounded --harness a_validated_span_does_not_wrap

  lean:
    name: lean (the decision model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lean/Redoubt.lean is a standalone file, not a Lake package, so
      # leanprover/lean-action is not usable here: it refuses to configure
      # without a lake-manifest.json. Elan reads lean-toolchain at the repo
      # root and installs exactly the pinned Lean, which is all this check needs.
      - name: install elan from lean-toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: check the proofs
        run: lean lean/Redoubt.lean

  snow-parity:
    name: handshake parity with reference Noise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test snow_parity -- --nocapture
