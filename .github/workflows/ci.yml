name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: formatting
        run: cargo fmt --all -- --check
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --all-targets

  kani:
    name: kani (proofs over the compiled code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          args: --all-features

  lean:
    name: lean (the decision model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - name: check the proofs
        run: lean lean/Redoubt.lean

  snow-parity:
    name: handshake parity with reference Noise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test snow_parity -- --nocapture
